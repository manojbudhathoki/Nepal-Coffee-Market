<article class="producer-card">{% if p.image_url %}<img class="card-photo" src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy">{% else %}<div class="photo-placeholder">☕</div>{% endif %}<div class="card-body"><div class="d-flex justify-content-between align-items-center gap-2 mb-2"><span class="small-label">{{ p.district }}, {{ p.province }}</span><span class="rating">★ {{ p.rating }}</span></div><h2 class="h4">{{ p.name }}</h2>{% if p.verified %}<span class="badge badge-soft mb-2">✓ Directory verified</span>{% endif %}<p class="muted">{{ p.tagline|default:p.description|truncatechars:115 }}</p><div class="d-flex justify-content-between align-items-center mt-3"><span class="small muted">{{ p.products.count }} product{{ p.products.count|pluralize }}</span><a href="{{ p.get_absolute_url }}" class="fw-bold text-decoration-none">View profile →</a></div></div></article>
